  <text x="44" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="37" fill="#f4f0e9">Make room for</text>
  <text x="44" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="37" fill="#e6bb78">connected thinking.</text>
  <text x="47" y="267" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#a6b4c6">Your files. Your graph. Your way of working.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2" fill="#91a4ba"><text x="47" y="315">LOCAL FIRST</text><text x="195" y="315">MARKDOWN</text><text x="340" y="315">VISUAL KNOWLEDGE</text></g>
