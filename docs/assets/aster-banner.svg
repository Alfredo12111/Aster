<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Aster — Make room for connected thinking.</title>
  <desc id="desc">A local-first knowledge workspace with a customizable graph, Markdown vaults, and built-in research tools.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b20"/><stop offset="1" stop-color="#222c37"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#e6bb78" stop-opacity=".13"/><stop offset="1" stop-color="#e6bb78" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#8191a8" opacity=".13"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/><rect width="1280" height="360" rx="18" fill="url(#dots)"/>
  <circle cx="1020" cy="168" r="236" fill="url(#glow)"/>
  <g stroke="#e6bb78" stroke-width="3" stroke-linecap="round"><path d="M64 48v42M43 69h42M49 54l30 30M49 84l30-30"/></g>
