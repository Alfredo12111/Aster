  <g fill="#81bdb1"><circle cx="1062" cy="61" r="6"/><circle cx="1168" cy="142" r="6"/></g><g fill="#ac9ad4"><circle cx="1084" cy="278" r="6"/><circle cx="985" cy="301" r="5"/></g><circle cx="782" cy="254" r="6" fill="#dd919d"/><circle cx="788" cy="91" r="7" fill="#8baed8"/><circle cx="893" cy="60" r="5" fill="#e6bb78"/>
